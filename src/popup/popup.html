<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>翻译设置</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="popup-header__icon" aria-hidden="true">译</div>
      <div>
        <h1 class="popup-title">选中翻译</h1>
        <p class="popup-subtitle">选中网页中的英文即可查词或翻译为简体中文</p>
      </div>
    </header>

    <section class="card" aria-labelledby="heading-behavior">
      <h2 id="heading-behavior" class="card__title">行为</h2>
      <div class="setting-row">
        <div class="setting-row__text">
          <span class="setting-row__label">启用翻译</span>
          <span class="setting-row__hint">关闭后不再显示「译」按钮与结果浮层</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="enableSwitch" aria-label="启用翻译" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <div class="setting-row__text">
          <span class="setting-row__label">直接显示翻译结果</span>
          <span class="setting-row__hint">选中后立刻弹出结果，跳过「译」按钮</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="directTranslateSwitch" aria-label="直接显示翻译结果">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <p id="apiStatus" class="api-status" role="status" aria-live="polite" hidden></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
